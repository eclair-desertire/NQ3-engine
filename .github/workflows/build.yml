name: build

# NQ3 engine CI: the platforms Vinitive ships on. (Upstream Quake3e builds many
# more targets; they can come back here when we support them.)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  workflow_dispatch:

jobs:
  windows:
    name: Windows MSVC x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Get glslang
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip -OutFile glslang.zip
          Expand-Archive glslang.zip tools/glslang

      - name: Shaders match their sources
        run: python tools/build_shaders.py --check

      - name: Build (OpenGL, Vulkan, dedicated)
        shell: pwsh
        run: ./build-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: nq3-windows-x64
          path: code/win32/msvc2017/output/*.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound2-dev

      - name: Build
        run: make release -j$(nproc)

      - uses: actions/upload-artifact@v7
        with:
          name: nq3-linux-x86_64
          path: build/release-*/quake3e*
          if-no-files-found: error
          retention-days: 7
